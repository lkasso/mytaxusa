<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Returns</title><link rel="stylesheet" href="/static/css/filing.css"></head><body><header><a href="/welcome"><img src="/static/images/mytaxusa-logo.svg" alt="MyTaxUSA"></a><span>Returns</span><a href="/">Home</a></header><main style="max-width:900px;margin:40px auto"><h1>Your returns</h1><p>Saved locally for this browser. Use fictional information.</p><form action="/returns/new" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Return name<input name="name" maxlength="100" placeholder="My return"></label><div class="actions"><button>Create blank return</button></div></form>{% for record in records %}<section><h2>{{record.name}}</h2><p>{{record.count}} of 14 pages completed · Last saved {{record.updated}} UTC</p><div class="actions"><form method="post" action="/returns/{{record.id}}/open"><input type="hidden" name="csrf" value="{{csrf}}"><button>Open return</button></form><form method="post" action="/returns/{{record.id}}/delete"><input type="hidden" name="csrf" value="{{csrf}}"><button class="secondary">Delete return</button></form></div></section>{% else %}<p>No saved returns yet.</p>{% endfor %}</main></body></html>
